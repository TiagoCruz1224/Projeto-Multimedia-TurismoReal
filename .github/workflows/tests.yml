name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  phpunit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # PHP 8.2 is the minimum in composer.json; the suite runs on SQLite in memory (phpunit.xml)
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
          extensions: bcmath, exif, fileinfo, pdo_sqlite
          tools: composer:2.11.1
          coverage: none

      - run: cp .env.example .env

      # Versions come from composer.lock
      - run: composer install --no-interaction --no-progress

      - run: php artisan key:generate

      - run: php artisan test
